<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2026 新高一暑假衔接课">
    <meta name="theme-color" content="#f4f8ff">
    <title>2026 新高一暑假衔接课</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="./styles.css?v=20260806-5">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.2.2/artplayer.min.js"></script>
    <script defer src="./site-config.js?v=20260806-5"></script>
    <script defer src="./app.js?v=20260806-5"></script>
</head>
<body>
    <main class="page-stage">
        <div class="page-glow" aria-hidden="true"></div>

        <section id="access-gate" class="access-gate" aria-labelledby="gate-title">
            <form id="access-form" class="access-panel">
                <div class="gate-heading">
                    <h1 id="gate-title">Password</h1>
                </div>

                <label class="sr-only" for="access-password">访问密码</label>
                <input
                    id="access-password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Password"
                    aria-describedby="access-message"
                    required
                >
                <button id="access-submit" type="submit">Enter</button>
                <p id="access-message" class="form-message" aria-live="polite"></p>
            </form>
        </section>

        <section id="site-shell" class="player-shell" hidden>
            <div class="player-heading">
                <h1>2026 河源中学新高一暑假衔接课</h1>
            </div>

            <nav id="course-grid" class="course-grid" aria-label="选择科目"></nav>

            <section id="classroom" class="classroom" aria-labelledby="classroom-title">
                <div class="lesson-heading">
                    <h2 id="classroom-title">语文衔接课</h2>
                </div>

                <div id="player-frame" class="player-frame">
                    <div id="player" class="player"></div>
                    <div id="player-empty" class="player-empty">
                        <span class="empty-subject">语</span>
                        <div>
                            <strong>正在准备课程</strong>
                        </div>
                    </div>
                </div>

                <p id="player-status" class="sr-only" aria-live="polite"></p>
            </section>
        </section>
    </main>
</body>
</html>

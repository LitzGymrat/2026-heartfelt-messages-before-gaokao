<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2026 新高一暑假衔接课">
    <meta name="theme-color" content="#f3f1eb">
    <title>2026 新高一暑假衔接课</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.2.2/artplayer.min.js"></script>
    <script defer src="./site-config.js"></script>
    <script defer src="./app.js"></script>
</head>
<body>
    <section id="access-gate" class="access-gate" aria-labelledby="gate-title">
        <form id="access-form" class="access-panel">
            <h1 id="gate-title">新高一暑假衔接课</h1>
            <label for="access-password">访问密码</label>
            <div class="password-row">
                <input id="access-password" type="password" autocomplete="current-password" required>
                <button id="access-submit" type="submit">进入</button>
            </div>
            <p id="access-message" class="form-message" aria-live="polite"></p>
        </form>
    </section>

    <div id="site-shell" class="site-shell" hidden>
        <header class="site-header">
            <h1>2026 新高一暑假衔接课</h1>
            <button id="logout-button" type="button">退出</button>
        </header>

        <main>
            <nav id="course-grid" class="course-grid" aria-label="选择科目"></nav>

            <section id="classroom" class="classroom" aria-labelledby="classroom-title">
                <div class="lesson-header">
                    <h2 id="classroom-title">语文衔接课</h2>
                    <div class="lesson-actions">
                        <span id="lesson-duration">约 40 分钟</span>
                        <button id="reset-progress" type="button">清除进度</button>
                    </div>
                </div>

                <div id="player-frame" class="player-frame">
                    <div id="player" class="player"></div>
                    <div id="player-empty" class="player-empty">
                        <span class="empty-subject">语</span>
                        <div>
                            <strong>暂无视频</strong>
                        </div>
                    </div>
                </div>

                <div class="player-meta">
                    <p id="lesson-progress">尚未开始</p>
                    <p id="player-status" aria-live="polite">未加载</p>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
